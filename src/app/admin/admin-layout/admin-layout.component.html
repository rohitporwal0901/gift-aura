<div class="fc-admin-wrap" [class.collapsed]="isSidebarCollapsed()">

  <!-- ══════════ MOBILE HEADER BAR ══════════ -->
  <header class="fc-mobile-header">
    <button class="fc-mobile-menu-btn" (click)="toggleMobileDrawer()" type="button" aria-label="Open Navigation">
      <span class="material-symbols-outlined">{{ isMobileDrawerOpen() ? 'close' : 'menu' }}</span>
    </button>
    <div class="fc-mobile-brand" routerLink="/admin/dashboard">
      <div class="fc-logo-badge fc-logo-badge-sm">
        <svg class="fc-logo-crest" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="42" height="42" rx="12" fill="url(#crestGradMob)" />
          <text x="21" y="26" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="14"
            fill="#ffffff" letter-spacing="0.5">GA</text>
          <defs>
            <linearGradient id="crestGradMob" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1E293B" />
              <stop offset="1" stop-color="#0F172A" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="fc-mobile-title">
        <span class="fc-mob-name">Gift Aura</span>
        <span class="fc-mob-sub">Admin</span>
      </div>
    </div>
    <div class="fc-mobile-actions">
      <a routerLink="/admin/orders" class="fc-mob-order-btn" title="Orders">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span class="fc-badge fc-badge-mob" *ngIf="pendingOrdersCount() > 0">{{ pendingOrdersCount() }}</span>
      </a>
    </div>
  </header>

  <!-- ══════════ MOBILE SIDEBAR BACKDROP ══════════ -->
  <div class="fc-sidebar-backdrop" [class.active]="isMobileDrawerOpen()" (click)="closeMobileDrawer()"></div>

  <!-- ══════════ SIDEBAR (DESKTOP & MOBILE DRAWER) ══════════ -->
  <aside class="fc-sidebar" [class.mobile-open]="isMobileDrawerOpen()">
    <!-- Brand Logo -->
    <div class="fc-sidebar-logo">
      <div class="fc-logo-badge">
        <svg class="fc-logo-crest" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="42" height="42" rx="12" fill="url(#crestGrad)" />
          <rect x="0.75" y="0.75" width="40.5" height="40.5" rx="11.25" stroke="url(#borderGrad)" stroke-width="1.5" />
          <circle cx="21" cy="21" r="15" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.65" />
          <!-- GA Monogram -->
          <text x="21" y="26" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="14"
            fill="#ffffff" letter-spacing="0.5">GA</text>
          <path d="M21 9 C22.5 7, 25.5 7, 26.5 8.5 C26.5 10.5, 24 12, 21 11" stroke="#F59E0B" stroke-width="1.5"
            stroke-linecap="round" />
          <circle cx="21" cy="9" r="1.5" fill="#F59E0B" />
          <defs>
            <linearGradient id="crestGrad" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1E293B" />
              <stop offset="1" stop-color="#0F172A" />
            </linearGradient>
            <linearGradient id="borderGrad" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F59E0B" stop-opacity="0.9" />
              <stop offset="1" stop-color="#D97706" stop-opacity="0.6" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="fc-logo-text">
        <h2>Gift Aura</h2>
        <div class="fc-admin-status">
          <span class="fc-status-dot"></span>
          <span>Admin Portal</span>
        </div>
      </div>
      <button class="fc-sidebar-close-mob" (click)="closeMobileDrawer()" type="button" aria-label="Close menu">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="fc-nav">
      <!-- OVERVIEW -->
      <div class="fc-nav-section">OVERVIEW</div>

      <a routerLink="/admin/dashboard" routerLinkActive="fc-nav-active" class="fc-nav-item"
        (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="fc-nav-label">Dashboard</span>
      </a>

      <a routerLink="/admin/orders" routerLinkActive="fc-nav-active" class="fc-nav-item" (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">shopping_bag</span>
        <span class="fc-nav-label">Orders</span>
        <span class="fc-badge" *ngIf="pendingOrdersCount() > 0">{{ pendingOrdersCount() }}</span>
      </a>

      <a routerLink="/admin/transactions" routerLinkActive="fc-nav-active" class="fc-nav-item"
        (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="fc-nav-label">Transactions</span>
      </a>

      <!-- CATALOG -->
      <div class="fc-nav-section">CATALOG</div>

      <a routerLink="/admin/categories" routerLinkActive="fc-nav-active" class="fc-nav-item"
        (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">category</span>
        <span class="fc-nav-label">Categories</span>
      </a>

      <a routerLink="/admin/products" routerLinkActive="fc-nav-active" class="fc-nav-item"
        (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">inventory_2</span>
        <span class="fc-nav-label">Products</span>
      </a>

      <!-- <a routerLink="/admin/combo-cards" routerLinkActive="fc-nav-active" class="fc-nav-item" (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">auto_awesome</span>
        <span class="fc-nav-label">Combo Cards</span>
      </a> -->

      <!-- CONFIG -->
      <div class="fc-nav-section">CONFIG</div>

      <a routerLink="/admin/settings" routerLinkActive="fc-nav-active" class="fc-nav-item"
        (click)="closeMobileDrawer()">
        <span class="material-symbols-outlined">settings</span>
        <span class="fc-nav-label">Settings</span>
      </a>
    </nav>

    <!-- Footer: Logout -->
    <div class="fc-sidebar-footer">
      <div class="fc-sidebar-user">
        <div class="fc-user-avatar">🎁</div>
        <div class="fc-user-info">
          <strong>Admin</strong>
          <span>Gift Aura Admin</span>
        </div>
      </div>
      <button class="fc-logout-btn" (click)="promptLogout()">
        <span class="material-symbols-outlined">logout</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- ══════════ MAIN AREA ══════════ -->
  <main class="fc-main">
    <!-- Page content -->
    <div class="fc-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Logout modal -->
<app-confirmation-modal [isOpen]="isLogoutModalOpen" title="Confirm Logout"
  message="Are you sure you want to log out of the admin panel?" confirmText="Logout" cancelText="Stay"
  (confirm)="confirmLogout()" (cancel)="cancelLogout()">
</app-confirmation-modal>

<app-snackbar></app-snackbar>
